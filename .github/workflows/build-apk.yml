name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk widgetUV.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WidgetUV-APK
          path: widgetUV.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.ref_name }}
          name: Widget UV ${{ github.ref_name }}
          body: |
            ### ☀️ Widget UV para Android (Samsung Galaxy One UI)
            - **Widgets incluidos**: 1x1 Compacto, 2x1 Horizontal y 2x2 Completo.
            - **Geolocalización eficiente**: Sincronización GPS inteligente a las 7:00 AM y 2:00 PM.
            - **Curva horaria**: 07:00 a 22:00 centrada en la hora actual.
            - **Provincia automática** y carrusel de recomendaciones de salud.
          files: widgetUV.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
